<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="关于我 - 绘画BLOG" />
    <title>关于 · 绘画BLOG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #d9d6ce;
            color: #292a27;
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            line-height: 1.7;
        }

        body:before {
            z-index: -1;
            pointer-events: none;
            content: "";
            opacity: .3;
            background-image: radial-gradient(#c9d0cf .55px, transparent .55px);
            background-size: 8px 8px;
            position: fixed;
            inset: 0;
        }

        .site-shell {
            min-height: 100vh;
            overflow: hidden;
        }

        .page-width {
            width: min(1240px, 100% - 64px);
            margin-inline: auto;
        }

        /* ===== Header ===== */
        .site-header {
            background: #ffffff;
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: center;
            min-height: 72px;
            padding: 0 22px;
        }

        .site-header.page-width {
            width: 100%;
            padding-inline: max(40px, 50vw - 578px);
        }

        .brand {
            flex: none;
            align-items: center;
            gap: 9px;
            min-width: 0;
            display: inline-flex;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .brand__logo {
            object-fit: cover;
            border-radius: 2px;
            width: 158px;
            height: 62px;
            display: block;
            background: #34322d;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            line-height: 42px;
        }

        .site-nav {
            white-space: nowrap;
            flex-wrap: nowrap;
            flex: 0 auto;
            align-items: center;
            gap: 23px;
            min-width: 0;
            display: flex;
            overflow: hidden;
        }

        .site-nav__link {
            color: #8a877f;
            letter-spacing: .01em;
            white-space: nowrap;
            transition: color .18s ease;
            flex: none;
            font-size: 12px;
            font-weight: 400;
            text-decoration: none;
            position: relative;
            cursor: pointer;
        }

        .site-nav__link:hover,
        .site-nav__link--active {
            color: #d88478;
        }

        .site-nav__link--active:after {
            background: #d88478;
            content: "";
            height: 2px;
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
        }

        .header-control {
            color: #292a27;
            transition: color .18s ease, transform .18s ease;
            flex: none;
            display: grid;
            place-items: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 17px;
        }

        .header-control:hover {
            color: #d88478;
            transform: translateY(-1px);
        }

        .header-avatar {
            border: 1px solid #d9d6ce;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            flex: none;
            display: block;
            overflow: hidden;
            text-decoration: none;
            background: #d88478;
            color: #fff;
            font-size: 12px;
            text-align: center;
            line-height: 27px;
        }

        /* ===== Hero ===== */
        .reference-hero {
            height: 292px;
            position: relative;
            overflow: hidden;
            background: #c9d0cf;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ★ 图片位置 1：Hero 背景图 ★ */
        .reference-hero {
            background-image: url('images/roamsketch-village-banner.png');
            background-size: cover;
            background-position: center;
        }

        .reference-hero__veil {
            background: linear-gradient(90deg, #0f312d85, #0f312d12 58%, #0f312d33);
            position: absolute;
            inset: 0;
        }

        .reference-hero p {
            color: #fff;
            letter-spacing: .06em;
            text-align: center;
            background: #1b26287a;
            border-radius: 999px;
            max-width: calc(100% - 40px);
            margin: 0;
            padding: 7px 23px;
            font-family: "Noto Serif SC", serif;
            font-size: clamp(15px, 2vw, 21px);
            position: relative;
            z-index: 1;
        }

        /* ===== Profile Strip ===== */
        .profile-strip {
            background: #dce5e2;
            border-bottom: 1px solid #cfdad6;
            align-items: center;
            min-height: 40px;
            padding: 5px max(40px, 50vw - 578px);
            display: flex;
        }

        .profile-strip__link {
            color: #7a8581;
            white-space: nowrap;
            min-width: 0;
            max-width: 100%;
            transition: color .18s ease;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            display: inline-flex;
            text-decoration: none;
            cursor: pointer;
        }

        .profile-strip__link:hover {
            color: #d88478;
        }

        .profile-strip__message {
            color: #8a9490;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            overflow: hidden;
        }

        /* ===== Main Content ===== */
        .reference-content {
            grid-template-columns: 200px minmax(0, 1fr);
            gap: 36px;
            padding-top: 42px;
            padding-bottom: 74px;
            display: grid;
        }

        .home-reference-content {
            grid-template-columns: minmax(0, 1fr);
        }

        .reference-main {
            min-width: 0;
        }

        .content-heading {
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin: 2px 0 22px;
            display: flex;
        }

        .content-heading h2 {
            color: #292a27;
            letter-spacing: -.06em;
            margin: 3px 0 0;
            font-family: "Noto Serif SC", serif;
            font-size: clamp(25px, 3vw, 33px);
            font-weight: 600;
            line-height: 1.25;
        }

        .content-kicker {
            color: #7d9875;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin: 0;
            font-family: "IBM Plex Mono", monospace;
            font-size: 10px;
        }

        /* ===== About Content ===== */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            margin: 2rem 0 3rem;
        }

        .about-image img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(38, 51, 59, 0.08);
            display: block;
        }

        .about-text h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-family: "Noto Serif SC", serif;
        }

        .about-text p {
            margin-bottom: 1rem;
            line-height: 1.8;
            color: #5e5e5b;
        }

        .about-text a {
            color: #d88478;
            text-decoration: underline;
        }

        .about-text a:hover {
            color: #c97a6e;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: #d88478;
            color: #fff;
        }

        .btn-primary:hover {
            background: #c97a6e;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(38, 51, 59, 0.13);
        }

        .btn-secondary {
            background: #b3c2a3;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #a2b192;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(38, 51, 59, 0.13);
        }

        /* ===== Contact Section ===== */
        .contact-section {
            margin: 3rem 0 2rem;
            padding: 2.5rem;
            background: #f7f3eb;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(38, 51, 59, 0.06);
            border: 1px solid #e1e5e3;
        }

        .contact-section h2 {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-family: "Noto Serif SC", serif;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .contact-item {
            text-align: center;
        }

        .contact-item i {
            font-size: 2rem;
            color: #d88478;
            margin-bottom: 0.8rem;
        }

        .contact-item h3 {
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }

        .contact-item a {
            color: #d88478;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .contact-item p {
            color: #5e5e5b;
        }

        .contact-form {
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-form .form-group {
            margin-bottom: 1.2rem;
        }

        .contact-form label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d9d6ce;
            border-radius: 8px;
            background: #fcfaf5;
            color: #292a27;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: #d88478;
        }

        .contact-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .contact-form .btn {
            width: 100%;
            text-align: center;
        }

        /* ===== Footer ===== */
        .site-footer {
            min-height: 62px;
            color: #8a877f;
            border-top: 1px solid #e1e5e3;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            padding-bottom: 22px;
            font-family: "IBM Plex Mono", monospace;
            font-size: 9px;
            display: flex;
        }

        .footer-links {
            display: flex;
            gap: 1.2rem;
        }

        .footer-links a {
            color: #8a877f;
            font-size: 1.1rem;
            transition: color 0.3s;
            text-decoration: none;
        }

        .footer-links a:hover {
            color: #d88478;
        }

        /* ===== Responsive ===== */
        @media (max-width: 820px) {
            .page-width {
                width: min(100% - 36px, 680px);
            }
            .home-reference-content {
                grid-template-columns: 1fr;
            }
            .site-header.page-width {
                width: 100%;
                padding-inline: 12px;
            }
            .site-nav {
                gap: 9px;
            }
            .site-nav__link {
                letter-spacing: 0;
                font-size: 11px;
            }
            .reference-hero {
                height: 245px;
            }
            .profile-strip {
                min-height: 36px;
                padding: 4px 12px;
            }
            .profile-strip__link {
                gap: 7px;
                font-size: 10px;
            }
            .reference-content {
                grid-template-columns: 82px minmax(0, 1fr);
                gap: 13px;
                padding-top: 20px;
            }
            .reference-content.home-reference-content {
                grid-template-columns: 1fr;
            }
            .about-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .about-text h2 {
                font-size: 1.6rem;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn {
                text-align: center;
            }
            .contact-section {
                padding: 1.5rem;
            }
        }

        @media (max-width: 520px) {
            body {
                font-size: 14px;
            }
            .brand__logo {
                width: 104px;
                height: 30px;
                font-size: 14px;
                line-height: 30px;
            }
            .site-nav {
                gap: 7px;
            }
            .site-nav__link {
                font-size: 10px;
            }
            .reference-hero {
                height: 220px;
            }
            .reference-hero p {
                padding: 6px 14px;
                font-size: 13px;
            }
            .about-text h2 {
                font-size: 1.3rem;
            }
            .contact-grid {
                grid-template-columns: 1fr;
            }
            .site-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding-bottom: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="site-shell">

        <!-- ===== Header ===== -->
        <header class="site-header page-width">
            <a class="brand" href="index.html">
    <img class="brand__logo" src="images/roamsketch-logo.jpg" alt="绘画BLOG" style="height:42px; width:auto;">
</a>
            <nav class="site-nav" aria-label="导航">
                <a class="site-nav__link" href="index.html">Home</a>
                <a class="site-nav__link site-nav__link--active" href="about.html">About</a>
                <button class="header-control" type="button" onclick="alert('🔍 搜索功能开发中')" aria-label="搜索">
                    🔍
                </button>
<img class="header-avatar" src="images/avatar.jpg" alt="头像" style="width:27px; height:27px; border-radius:50%; object-fit:cover;">
            </nav>
        </header>

        <!-- ===== Hero ===== -->
        <!-- ★ 图片位置 1：Hero 背景图 images/roamsketch-village-banner.png ★ -->
        <section class="reference-hero" aria-label="关于我">
            <div class="reference-hero__veil"></div>
        </section>

            </span>
        </section>

        <!-- ===== Main Content ===== -->
        <main class="reference-content page-width home-reference-content">
            <section class="reference-main">

                <!-- About -->
                <div class="content-heading">
                    <div>
                        <span class="content-kicker">ABOUT ME</span>
                    </div>
                </div>

                <div class="about-grid">
                    <!-- ★ 图片位置 2：个人照片 images/avatar.jpg ★ -->
                    <div class="about-image">
                        <img src="images/avatar.jpg" alt="关于我" onerror="this.src='https://picsum.photos/600/400?random=100'">
                    </div>
                    <div class="about-text">
                        <h2>你好，我是 Libby</h2>
                        <p>
                            绘画专业学代码新手。这个博客是分享我在生活上绘画记录属于我眼中的风景。
                        </p>
                        <p>
                            我还有另外一个网页是记录自己旅行博客：
                            <a href="https://woo-33.github.io/roamloom/" target="_blank" rel="noopener noreferrer">
                                https://woo-33.github.io/roamloom/
                            </a>
                    </div>
                    </div>

                <!-- Contact -->
                <div id="contact" class="contact-section">
                    <h2>联系我</h2>
                    <div class="contact-grid">
                        <div class="contact-item">
                            <i class="fas fa-envelope"></i>
                            <h3>邮箱</h3>
                            <a href="mailto:libbyhu@126.com">libbyhu@126.com</a>

                    </div>

                    <form class="contact-form" id="contactForm">
                        <div class="form-group">
                            <label for="name">姓名</label>
                            <input type="text" id="name" placeholder="您的姓名">
                        </div>
                        <div class="form-group">
                            <label for="email">邮箱</label>
                            <input type="email" id="email" placeholder="您的邮箱">
                        </div>
                        <div class="form-group">
                            <label for="message">消息</label>
                            <textarea id="message" placeholder="您的消息..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">发送消息</button>
                    </form>
                </div>

            </section>
        </main>

        <!-- ===== Footer ===== -->
        <footer class="site-footer page-width">
            <span>© 2026 roamsketch 保留所有权利</span>
            <div class="footer-links">
                <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" title="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" title="Pinterest"><i class="fab fa-pinterest"></i></a>
            </div>
        </footer>
    </div>

    <script>
        // ============================================================
        //  📧 联系表单
        // ============================================================
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !email || !message) {
                alert('⚠️ 请填写所有字段');
                return;
            }

            alert('✅ 消息已发送！我会尽快回复您。');
            this.reset();
        });

        // ============================================================
        //  🖼️ 图片加载失败时使用占位图
        // ============================================================
        document.querySelectorAll('img').forEach(img => {
            img.onerror = function() {
                this.src = 'https://picsum.photos/400/300?random=' + Math.random();
            };
        });
    </script>

</body>
</html>
