<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>绘画Blog · Sketchbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            color: #292a27;
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            line-height: 1.7;
        }

        body:before {
            z-index: -1;
            pointer-events: none;
            content: "";
            opacity: .3;
            background-image: radial-gradient(#c9d0cf .55px, transparent .55px);
            background-size: 8px 8px;
            position: fixed;
            inset: 0;
        }

        .site-shell {
            min-height: 100vh;
            overflow: hidden;
        }

        .page-width {
            width: min(1240px, 100% - 64px);
            margin-inline: auto;
        }

        /* ===== Header ===== */
        .site-header {
            background: #f7f3eb;
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: center;
            min-height: 72px;
            padding: 0 22px;
        }

        .site-header.page-width {
            width: 100%;
            padding-inline: max(40px, 50vw - 578px);
        }

        .brand {
            flex: none;
            align-items: center;
            gap: 9px;
            min-width: 0;
            display: inline-flex;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .brand__logo {
            height: 42px;
            width: auto;
            display: block;
            border-radius: 2px;
        }

        .site-nav {
            white-space: nowrap;
            flex-wrap: nowrap;
            flex: 0 auto;
            align-items: center;
            gap: 23px;
            min-width: 0;
            display: flex;
            overflow: hidden;
        }

        .site-nav__link {
            color: #8a877f;
            letter-spacing: .01em;
            white-space: nowrap;
            transition: color .18s ease;
            flex: none;
            font-size: 12px;
            font-weight: 400;
            text-decoration: none;
            position: relative;
            cursor: pointer;
        }

        .site-nav__link:hover,
        .site-nav__link--active {
            color: #d88478;
        }

        .site-nav__link--active:after {
            background: #d88478;
            content: "";
            height: 2px;
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
        }

        .header-control {
            color: #292a27;
            transition: color .18s ease, transform .18s ease;
            flex: none;
            display: grid;
            place-items: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 17px;
        }

        .header-control:hover {
            color: #d88478;
            transform: translateY(-1px);
        }

        .header-avatar {
            width: 27px;
            height: 27px;
            border-radius: 50%;
            flex: none;
            display: block;
            overflow: hidden;
            text-decoration: none;
            object-fit: cover;
        }

        /* ===== Hero ===== */
        .reference-hero {
            height: 292px;
            position: relative;
            overflow: hidden;
            background: #c9d0cf;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }

        .reference-hero__veil {
            background: linear-gradient(90deg, #0f312d85, #0f312d12 58%, #0f312d33);
            position: absolute;
            inset: 0;
        }

        .reference-hero p {
            color: #fff;
            letter-spacing: .06em;
            text-align: center;
            background: #1b26287a;
            border-radius: 999px;
            max-width: calc(100% - 40px);
            margin: 0;
            padding: 7px 23px;
            font-family: "Noto Serif SC", serif;
            font-size: clamp(15px, 2vw, 21px);
            position: relative;
            z-index: 1;
        }

        /* ===== Profile Strip ===== */
        .profile-strip {
            background: #dce5e2;
            border-bottom: 1px solid #cfdad6;
            align-items: center;
            min-height: 40px;
            padding: 5px max(40px, 50vw - 578px);
            display: flex;
        }

        .profile-strip__link {
            color: #7a8581;
            white-space: nowrap;
            min-width: 0;
            max-width: 100%;
            transition: color .18s ease;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            display: inline-flex;
            text-decoration: none;
            cursor: pointer;
        }

        .profile-strip__link:hover {
            color: #d88478;
        }

        .profile-strip__avatar {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .profile-strip__message {
            color: #8a9490;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            overflow: hidden;
        }

        /* ===== 列表页 ===== */
        .reference-content {
            grid-template-columns: 200px minmax(0, 1fr);
            gap: 36px;
            padding-top: 42px;
            padding-bottom: 74px;
            display: grid;
        }

        .home-reference-content {
            grid-template-columns: minmax(0, 1fr);
        }

        .reference-main {
            min-width: 0;
        }

        .content-heading {
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin: 2px 0 22px;
            display: flex;
        }

        .content-heading h2 {
            color: #292a27;
            letter-spacing: -.06em;
            margin: 3px 0 0;
            font-family: "Noto Serif SC", serif;
            font-size: clamp(25px, 3vw, 33px);
            font-weight: 600;
            line-height: 1.25;
        }

        .content-kicker {
            color: #7d9875;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin: 0;
            font-family: "IBM Plex Mono", monospace;
            font-size: 10px;
        }

        .content-count {
            color: #8a877f;
            font-family: "IBM Plex Mono", monospace;
            font-size: 10px;
        }

        .story-list {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 26px 18px;
            display: grid;
        }

        .story-card {
            background: #f7f3eb;
            box-shadow: 0 8px 24px rgba(38, 51, 59, 0.08);
            transition: box-shadow .22s ease, transform .22s ease;
            border-radius: 10px;
            display: block;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .story-card:hover {
            box-shadow: 0 14px 32px rgba(38, 51, 59, 0.13);
            transform: translateY(-3px);
        }

        .story-card__image {
            aspect-ratio: 4/3;
            background: #ebe7dc;
            display: block;
            position: relative;
            overflow: hidden;
        }

        .story-card__image img {
            object-fit: contain;
            width: 100%;
            height: 100%;
            display: block;
        }

        .story-card__body {
            padding: 16px 18px 18px;
            position: relative;
        }

        .story-card__tag {
            color: #60705d;
            background: #b3c2a3;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 10px;
            display: inline-block;
        }

        .story-card h3 {
            color: #292a27;
            letter-spacing: -.04em;
            margin: 11px 0 1px;
            font-family: "Noto Serif SC", serif;
            font-size: 23px;
            font-weight: 600;
        }

        .story-card__date {
            color: #8a877f;
            margin: 0;
            font-family: "IBM Plex Mono", monospace;
            font-size: 10px;
        }

        .story-card__link {
            color: #7d9875;
            transition: color .18s ease, gap .18s ease;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            display: inline-flex;
            text-decoration: none;
            margin-top: 8px;
        }

        .story-card__link span {
            font-size: 17px;
            line-height: 1;
        }

        .story-card__link:hover {
            color: #d88478;
            gap: 12px;
        }

        /* ===== 详情页 ===== */
        .detail-page {
            display: none;
            padding-top: 42px;
            padding-bottom: 74px;
        }

        .detail-page.active {
            display: block;
        }

        .back-link {
            color: #8a877f;
            transition: color .18s ease, gap .18s ease;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            display: inline-flex;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 24px;
        }

        .back-link:hover {
            color: #d88478;
            gap: 12px;
        }

        .detail-header {
            margin-bottom: 30px;
        }

        .detail-header h1 {
            font-family: "Noto Serif SC", serif;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .detail-header .detail-meta {
            color: #8a877f;
            font-family: "IBM Plex Mono", monospace;
            font-size: 12px;
        }

        .detail-header .detail-note {
            color: #5e5e5b;
            margin-top: 12px;
            font-size: 15px;
            line-height: 1.8;
        }

        .detail-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .detail-gallery img {
            width: 100%;
            border-radius: 10px;
            background: #ebe7dc;
            display: block;
        }

        /* ===== Sidebar ===== */
        .reference-sidebar {
            min-width: 0;
        }

        .sidebar-card {
            background: #f7f3eb;
            box-shadow: 0 8px 24px rgba(38, 51, 59, 0.08);
            border-radius: 10px;
            padding: 24px 22px;
            position: sticky;
            top: 24px;
        }

        .sidebar-card h1 {
            color: #292a27;
            letter-spacing: -.05em;
            margin: 5px 0 9px;
            font-family: "Noto Serif SC", serif;
            font-size: 25px;
            font-weight: 600;
        }

        .sidebar-card__intro {
            color: #8a877f;
            margin: 0;
            font-size: 12px;
            line-height: 1.85;
        }

        .sidebar-divider {
            background: #e1e5e3;
            height: 1px;
            margin: 21px 0;
        }

        .mood-block__label,
        .mood-block__date {
            color: #7d9875;
            letter-spacing: .08em;
            font-family: "IBM Plex Mono", monospace;
            font-size: 9px;
            display: block;
        }

        .mood-block p {
            color: #292a27;
            margin: 7px 0 8px;
            font-family: "Noto Serif SC", serif;
            font-size: 15px;
            line-height: 1.7;
        }

        .mood-block__date {
            color: #8a877f;
            letter-spacing: .02em;
        }

        .sidebar-meta {
            color: #8a877f;
            flex-direction: column;
            gap: 3px;
            font-family: "IBM Plex Mono", monospace;
            font-size: 9px;
            display: flex;
            margin-top: 16px;
        }

        .sidebar-note {
            color: #8a877f;
            margin-top: 20px;
            font-family: "IBM Plex Mono", monospace;
            font-size: 9px;
            line-height: 1.9;
            white-space: pre-wrap;
        }

        /* ===== Footer ===== */
        .site-footer {
            min-height: 62px;
            color: #8a877f;
            border-top: 1px solid #e1e5e3;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            padding-bottom: 22px;
            font-family: "IBM Plex Mono", monospace;
            font-size: 9px;
            display: flex;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .page-width {
                width: min(100% - 36px, 680px);
            }
            .home-reference-content {
                grid-template-columns: 1fr;
            }
            .story-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 22px 14px;
            }
            .home-reference-content .reference-sidebar {
                display: none;
            }
            .site-header.page-width {
                width: 100%;
                padding-inline: 12px;
            }
            .site-nav {
                gap: 9px;
            }
            .site-nav__link {
                letter-spacing: 0;
                font-size: 11px;
            }
            .reference-hero {
                height: 245px;
            }
            .profile-strip {
                min-height: 36px;
                padding: 4px 12px;
            }
            .profile-strip__link {
                gap: 7px;
                font-size: 10px;
            }
            .profile-strip__avatar {
                width: 23px;
                height: 23px;
            }
            .reference-content {
                grid-template-columns: 82px minmax(0, 1fr);
                gap: 13px;
                padding-top: 20px;
            }
            .reference-content.home-reference-content {
                grid-template-columns: 1fr;
            }
            .sidebar-card {
                width: 100%;
                margin: 0;
                padding: 13px 8px;
                position: static;
            }
            .detail-gallery {
                grid-template-columns: 1fr;
            }
            .detail-header h1 {
                font-size: 26px;
            }
        }

        @media (max-width: 520px) {
            body {
                font-size: 14px;
            }
            .brand__logo {
                height: 30px;
            }
            .site-nav {
                gap: 7px;
            }
            .site-nav__link {
                letter-spacing: 0;
                font-size: 10px;
            }
            .reference-hero {
                height: 220px;
            }
            .reference-hero p {
                padding: 6px 14px;
                font-size: 13px;
            }
            .story-list {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .story-card h3 {
                font-size: 22px;
            }
            .detail-header h1 {
                font-size: 22px;
            }
            .site-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding-bottom: 18px;
            }
        }

        /* ===== 隐藏列表页/详情页 ===== */
        .page-list {
            display: block;
        }
        .page-list.hidden {
            display: none;
        }
        .detail-page {
            display: none;
        }
        .detail-page.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="site-shell" id="app">

        <!-- ===== Header ===== -->
        <header class="site-header page-width">
            <a class="brand" href="index.html">
                <!-- ★ Logo 图片：images/roamsketch-logo.jpg ★ -->
                <img class="brand__logo" src="images/roamsketch-logo.jpg" alt="Sketchbook">
            </a>
            <nav class="site-nav" aria-label="导航">
                <a class="site-nav__link site-nav__link--active" href="index.html">Home</a>
                <a class="site-nav__link" href="sketchbook.html">Sketchbook</a>
                <a class="site-nav__link" href="about.html">About</a>
                <button class="header-control" type="button" onclick="alert('🔍 搜索功能开发中')" aria-label="搜索">
                    🔍
                </button>
                <!-- ★ 头像图片：images/avatar.jpg ★ -->
                <img class="header-avatar" src="images/avatar.jpg" alt="头像">
            </nav>
        </header>

        <!-- ===== Hero ===== -->
        <!-- ★ Hero 背景图：images/hero.jpg ★ -->
        <section class="reference-hero" aria-label="绘画日记简介" style="background-image: url('images/roamsketch-village-banner.png');">
            <div class="reference-hero__veil"></div>
        </section>

        <!-- ===== Profile Strip ===== -->
        <section class="profile-strip" aria-label="个人信息" style="background-color:#a7aead;">
            <span class="profile-strip__link">
                <!-- ★ Profile 头像：images/avatar.jpg ★ -->
                <img class="profile-strip__avatar" src="images/avatar.jpg" alt="头像">
                <span class="profile-strip__message" style="color:#737876;">愿每一次落在纸上的颜色，都有一个可以回来的地方。</span>
            </span>
        </section>

        <!-- ===== 列表页 ===== -->
        <div id="pageList" class="page-list">
            <main class="reference-content page-width home-reference-content">
                <section class="reference-main" id="latest" aria-label="Sketchbook">
                    <div class="content-heading">
                        <div>
                            <span class="content-kicker">LATEST NOTES</span>
                        </div>
                        <span class="content-count" id="entryCount">0 组记录</span>
                    </div>
                    <div class="story-list" id="entryList"></div>
                </section>
            </main>
        </div>

        <!-- ===== 详情页 ===== -->
        <div id="pageDetail" class="detail-page">
            <main class="reference-content page-width home-reference-content">
                <section class="reference-main">
                    <span class="back-link" onclick="goHome()">← 返回所有日记</span>
                    <div id="detailContent"></div>
                </section>
            </main>
        </div>

        <!-- ===== Footer ===== -->
        <footer class="site-footer page-width">
            <span>© 2026 roamsketch 保留所有权利</span>
            <span>慢慢画，慢慢看。</span>
        </footer>
    </div>

    <script>
        // ============================================================
        //  📦 数据 - 所有图片路径改为本地 images/ 文件夹
        // ============================================================
        const DIARY_DATA = {
            mood: {
                label: "今天的心情",

                date: "2026 · 08 · 26",

            },
            entries: [{

                    { src: "images/0901001.jpg", label: "" },

                    { src: "images/0901005.jpg", label: "" },

                    { src: "images/0901007.jpg", label: "" },
                    { src: "images/0901008.jpg", label: "" },
                    { src: "images/0901009.jpg", label: "" }
                ]
            }, {
                slug: "朋友们",

                date: "2026-08",

                countLabel: "13 张图",

                cover: "images/0827001.jpg",

                palette: "线条 · 色块 · 多媒体",
                images: [
                    { src: "images/0827001.jpg", label: "" },
                    { src: "images/0827002.jpg", label: "" },
                    { src: "images/0827003.jpg", label: "" },
                    { src: "images/0827004.jpg", label: "" },
                    { src: "images/0827005.jpg", label: "" },
                    { src: "images/0827006.jpg", label: "" },
                    { src: "images/0827007.jpg", label: "" },
                    { src: "images/0827008.jpg", label: "" },
                    { src: "images/0827009.jpg", label: "" },
                    { src: "images/0827010.jpg", label: "" },
                    { src: "images/0827011.jpg", label: "" },
                    { src: "images/0827012.jpg", label: "" },
                    { src: "images/0827013.jpg", label: "" }
                ]
            }, {
                slug: "静止的瞬间",
                title: "静止的瞬间",
                date: "2026-08-10",
                dateLabel: "2026 年 8 月 10 日",
                countLabel: "5 张图",
                note: "静止花瓶的瞬间，看者是站在窗外还是窗内随你选择",
                cover: "images/0810cover.jpg",
                coverAlt: "静止的瞬间",
                palette: "线条 · 光影",
                images: [
                    { src: "images/0810001.jpg", label: "" },
                    { src: "images/0810002.jpg", label: "" },
                    { src: "images/0810003.jpg", label: "" },
                    { src: "images/0810004.jpg", label: "" },
                    { src: "images/0810005.jpg", label: "" }
                ]
            }, {
                slug: "速写-2026-08-19",
                title: "其实速写就是一件很治愈的事",
                date: "2026-08-19",
                dateLabel: "2026 年 8 月 19 日",
                countLabel: "1 张图",
                note: "如图",
                cover: "images/0819cover.jpg",
                coverAlt: "速写线条",
                palette: "线条",
                images: [
                    { src: "images/0819001.jpg", label: "" }
                ]
            }, {
                slug: "速写-2026-08-26",
                title: "连笔画下即将过去的八月花花",
                date: "2026-08-26",
                dateLabel: "2026 年 8 月 26 日",
                countLabel: "1 张图",
                note: "如图",
                cover: "images/0826cover.jpg",
                coverAlt: "速写线条",
                palette: "线条",
                images: [
                    { src: "images/0826001.jpg", label: "" }
                ]
            }]
        };

        // ============================================================
        //  🖼️ 渲染
        // ============================================================

        let currentSlug = null;

        function renderList() {
            const list = document.getElementById('entryList');
            const count = document.getElementById('entryCount');

            count.textContent = DIARY_DATA.entries.length + ' 组记录';

            list.innerHTML = DIARY_DATA.entries.map((entry, index) => `
                <div class="story-card" onclick="openDetail('${entry.slug}')">
                    <div class="story-card__image">
                        <img src="${entry.cover}" alt="${entry.coverAlt || entry.title}" loading="${index === 0 ? 'eager' : 'lazy'}" onerror="this.src='https://picsum.photos/400/300?random=${index}'">
                    </div>
                    <div class="story-card__body">
                        <span class="story-card__tag">Sketchbook</span>
                        <h3>${entry.title}</h3>
                        <p class="story-card__date">绘画时间 · ${entry.dateLabel}</p>
                        <span class="story-card__link">
                            查看这一组 <span>→</span>
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function renderDetail(slug) {
            const entry = DIARY_DATA.entries.find(e => e.slug === slug);
            if (!entry) {
                goHome();
                return;
            }

            currentSlug = slug;

            const container = document.getElementById('detailContent');
            container.innerHTML = `
                <div class="detail-header">
                    <h1>${entry.title}</h1>
                    <p class="detail-meta">${entry.dateLabel} · ${entry.countLabel}</p>
                    <p class="detail-note">${entry.note}</p>
                    ${entry.palette ? `<p class="detail-meta" style="margin-top:6px;">🎨 ${entry.palette}</p>` : ''}
                </div>
                <div class="detail-gallery">
                    ${entry.images.map((img, index) => `
                        <img src="${img.src}" alt="${img.label || entry.title}" loading="lazy" onerror="this.src='https://picsum.photos/800/600?random=${index + 100}'">
                    `).join('')}
                </div>
            `;

            document.getElementById('pageList').classList.add('hidden');
            document.getElementById('pageDetail').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
            document.getElementById('pageList').classList.remove('hidden');
            document.getElementById('pageDetail').classList.remove('active');
            currentSlug = null;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openDetail(slug) {
            renderDetail(slug);
        }

        // 页面加载
        document.addEventListener('DOMContentLoaded', renderList);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderList);
        } else {
            renderList();
        }

        // URL 支持直接访问详情
        window.addEventListener('hashchange', function() {
            const slug = window.location.hash.replace('#', '');
            if (slug && DIARY_DATA.entries.find(e => e.slug === slug)) {
                renderDetail(slug);
            } else {
                goHome();
            }
        });

        if (window.location.hash) {
            const slug = window.location.hash.replace('#', '');
            if (slug && DIARY_DATA.entries.find(e => e.slug === slug)) {
                setTimeout(() => renderDetail(slug), 100);
            }
        }
    </script>

</body>
</html>
