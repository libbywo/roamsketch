<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roam Sketch</title>
    <style>
        :root {
            --bg-color: #f7f7f7;
            --text-color: #111111;
            --secondary-text: #777777;
            --card-bg: #ffffff;
            --nav-bg: rgba(247, 247, 247, 0.85);
            --border-color: #eeeeee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-top: 70px;
            padding-bottom: 60px;
        }

        /* 导航栏 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        nav {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: var(--text-color);
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--secondary-text);
            font-size: 0.95rem;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        .nav-links a.active, .nav-links a:hover {
            color: var(--text-color);
            font-weight: 500;
        }

        /* 主体布局 */
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* 卡片列表 */
        .gallery-grid {
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin-top: 20px;
        }

        .artwork-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .artwork-card {
                flex-direction: row;
                height: 480px;
            }
        }

        /* 轮播图区域 */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 320px;
            background-color: #f0f0f0;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .carousel-container {
                width: 60%;
                height: 100%;
            }
        }

        .carousel-slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #333;
            transition: background 0.2s;
            user-select: none;
        }

        .carousel-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .carousel-btn.prev { left: 12px; }
        .carousel-btn.next { right: 12px; }

        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }

        .dot.active {
            background-color: #ffffff;
            width: 16px;
            border-radius: 3px;
        }

        /* 信息描述区域 */
        .artwork-info {
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
        }

        @media (min-width: 768px) {
            .artwork-info {
                width: 40%;
            }
        }

        .artwork-header {
            margin-bottom: 16px;
        }

        .artwork-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .artwork-date {
            font-size: 0.85rem;
            color: var(--secondary-text);
        }

        .artwork-desc {
            font-size: 0.95rem;
            color: #444;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .artwork-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            background-color: #f0f0f0;
            border-radius: 20px;
            color: var(--secondary-text);
        }

        /* 归档列表样式 */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .archive-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .archive-thumb {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .archive-details {
            padding: 16px;
        }

        /* 关于页样式 */
        .about-content {
            max-width: 600px;
            margin: 40px auto 0;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .about-content h2 {
            margin-bottom: 16px;
            font-size: 1.5rem;
        }

        .about-content p {
            margin-bottom: 16px;
            color: #444;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="logo" onclick="switchPage('home')">Roam Sketch</a>
            <div class="nav-links">
                <a id="nav-home" class="active" onclick="switchPage('home')">首页</a>
                <a id="nav-archive" onclick="switchPage('archive')">归档</a>
                <a id="nav-about" onclick="switchPage('about')">关于</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- 首页 -->
        <section id="home" class="page active">
            <div id="home-gallery" class="gallery-grid"></div>
        </section>

        <!-- 归档页 -->
        <section id="archive" class="page">
            <div id="archive-container" class="archive-grid"></div>
        </section>

        <!-- 关于页 -->
        <section id="about" class="page">
            <div class="about-content">
                <h2>关于 Roam Sketch</h2>
                <p>这里是我日常速写、灵感记录与视觉实验的私人归档空间。</p>
                <p>漫游于线稿、色彩与空间构想之间，记录生活与设计的即兴表达。</p>
            </div>
        </section>
    </main>

    <script>
        // 数据配置
        const artworks = [
            {
                id: 5,
                title: "蛇年版画概念",
                date: "2026.08",
                description: "结合盖亚与美杜莎意象的蛇年生肖木刻版画表达，融合现代线条与传统拓印质感。",
                images: [
                    "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=800",
                    "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=800"
                ],
                tags: ["版画", "概念设计", "插画"]
            },
            {
                id: 4,
                title: "康普茶发酵实验",
                date: "2026.06",
                description: "探索红茶与岩茶基底在二次发酵下的气泡与口感变化，兼具视觉与味觉的记录。",
                images: [
                    "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=800"
                ],
                tags: ["发酵", "生活记录"]
            },
            {
                id: 3,
                title: "人宠植物空间构想",
                date: "2026.05",
                description: "复合型人宠植物生活馆概念图，整合猫咪动线、绿植展区与流线型休庇空间。",
                images: [
                    "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800",
                    "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800"
                ],
                tags: ["空间设计", "3D渲染", "绿植"]
            },
            {
                id: 2,
                title: "莫奈花园色彩研究",
                date: "2025.12",
                description: "以油画质感解析光影与植物层次的重叠关系，重构自然光照下的色块平衡。",
                images: [
                    "https://images.unsplash.com/photo-1579783901586-d88272d437b9?w=800"
                ],
                tags: ["油画", "色彩研究"]
            },
            {
                id: 1,
                title: "马泰拉石城光影速写",
                date: "2025.09",
                description: "意大利马泰拉古城建筑立面速写，关注负空间与强烈方向光下的建筑轮廓。",
                images: [
                    "https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=800",
                    "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=800"
                ],
                tags: ["速写", "建筑", "黑白"]
            }
        ];

        // 当前卡片轮播索引
        const currentImageIndexes = {};
        artworks.forEach(art => {
            currentImageIndexes[art.id] = 0;
        });

        // 页面切换
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-links a').forEach(link => link.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');
            document.getElementById(`nav-${pageId}`).classList.add('active');
            window.scrollTo(0, 0);
        }

        // 渲染画廊
        function renderGallery() {
            const homeGallery = document.getElementById('home-gallery');
            const archiveContainer = document.getElementById('archive-container');

            // 锁定首页显示的固定 ID 顺序：5, 3, 2
            const featuredIds = [5, 3, 2];

            const featuredArtworks = featuredIds
                .map(id => artworks.find(item => item.id === id))
                .filter(item => item !== undefined);

            // 1. 渲染首页卡片
            if (homeGallery) {
                homeGallery.innerHTML = featuredArtworks.map(item => `
                    <article class="artwork-card">
                        <div class="carousel-container" id="carousel-${item.id}">
                            <img class="carousel-slide" src="${item.images[currentImageIndexes[item.id]]}" alt="${item.title}">
                            ${item.images.length > 1 ? `
                                <button class="carousel-btn prev" onclick="changeSlide(${item.id}, -1)">❮</button>
                                <button class="carousel-btn next" onclick="changeSlide(${item.id}, 1)">❯</button>
                                <div class="carousel-dots">
                                    ${item.images.map((_, i) => `
                                        <span class="dot ${i === currentImageIndexes[item.id] ? 'active' : ''}"></span>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                        <div class="artwork-info">
                            <div class="artwork-header">
                                <h3 class="artwork-title">${item.title}</h3>
                                <span class="artwork-date">${item.date}</span>
                            </div>
                            <p class="artwork-desc">${item.description}</p>
                            <div class="artwork-tags">
                                ${item.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                            </div>
                        </div>
                    </article>
                `).join('');
            }

            // 2. 渲染归档页列表 (显示全部)
            if (archiveContainer) {
                archiveContainer.innerHTML = artworks.map(item => `
                    <div class="archive-card">
                        <img class="archive-thumb" src="${item.images[0]}" alt="${item.title}">
                        <div class="archive-details">
                            <h4 style="margin-bottom: 4px;">${item.title}</h4>
                            <p style="font-size: 0.8rem; color: #777;">${item.date}</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        // 切换轮播图
        function changeSlide(id, direction) {
            const item = artworks.find(a => a.id === id);
            if (!item) return;

            const total = item.images.length;
            currentImageIndexes[id] = (currentImageIndexes[id] + direction + total) % total;

            const carousel = document.getElementById(`carousel-${id}`);
            if (carousel) {
                const img = carousel.querySelector('.carousel-slide');
                const dots = carousel.querySelectorAll('.dot');

                img.src = item.images[currentImageIndexes[id]];
                dots.forEach((dot, idx) => {
                    if (idx === currentImageIndexes[id]) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }
        }

        // 确保 DOM 加载完毕后渲染
        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();
        });
    </script>
</body>
</html>
